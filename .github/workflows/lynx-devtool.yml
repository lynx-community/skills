name: Lynx DevTool E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/agent-lynx/**"
      - "packages/mcp-servers/devtool-connector/**"
      - "packages/mcp-servers/devtool-mcp-server/**"
      - "packages/skills/lynx-devtool/**"
      - ".github/workflows/lynx-devtool.yml"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - "packages/agent-lynx/**"
      - "packages/mcp-servers/devtool-connector/**"
      - "packages/mcp-servers/devtool-mcp-server/**"
      - "packages/skills/lynx-devtool/**"
      - ".github/workflows/lynx-devtool.yml"
      - ".github/scripts/**"
  workflow_dispatch:

env:
  # Use Mesa's software EGL path for windowless rendering on headless runners.
  EGL_PLATFORM: surfaceless
  LIBGL_ALWAYS_SOFTWARE: "1"
  LYNX_DEBUG_ROUTER_PORT: "8901"
  LYNX_DEVTOOL_MCP_TESTING_TRANSPORTS: Lynxtron
  LYNX_DEVTOOL_MCP_TESTING_APP_PACKAGE: Lynxtron
  # Generic Lynx page for connector / mcp-server tools.
  SWIPER_BUNDLE_URL: https://lynxjs.org/lynx-examples/swiper/dist/Swiper.lynx.bundle
  # ReactLynx page bundled with @lynx-js/preact-devtools for reactlynx tooling.
  REACT_DEVTOOL_BUNDLE_URL: https://unpkg.com/@lynx-example/react-devtool@0.2.0/dist/main.lynx.bundle

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Pnpm
        run: npm i -g corepack@latest --force && corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Install Lynxtron
        run: |
          set -euo pipefail
          LYNXTRON_ROOT="$RUNNER_TEMP/lynxtron-0.0.31"
          mkdir -p "$LYNXTRON_ROOT"
          npm install --prefix "$LYNXTRON_ROOT" --no-package-lock --no-save @lynx-js/lynxtron@0.0.31
          echo "LYNXTRON_ROOT=$LYNXTRON_ROOT" >> "$GITHUB_ENV"

      - name: Install Lynxtron system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libegl1 libegl-mesa0 libepoxy-dev libgles2 libgl1-mesa-dri libva-dev libvdpau1

      # --- Generic tools: connector + mcp-server against the Swiper bundle ---

      - name: Start Lynxtron (Swiper bundle)
        run: |
          set -euo pipefail
          LYNXTRON_PAGE_URL="$SWIPER_BUNDLE_URL" \
            setsid node "$LYNXTRON_ROOT/node_modules/@lynx-js/lynxtron/cli.js" .github/scripts/lynxtron-e2e.mjs \
            < /dev/null > /tmp/lynxtron-swiper.log 2>&1 &
          pid=$!
          echo "LYNXTRON_SWIPER_PID=$pid" >> "$GITHUB_ENV"
          ./.github/scripts/wait-debug-router.sh /tmp/lynxtron-swiper.log "$pid"

      - name: E2E (devtool-connector)
        working-directory: packages/mcp-servers/devtool-connector
        env:
          LYNX_DEVTOOL_MCP_TESTING_PAGE_URL: ${{ env.SWIPER_BUNDLE_URL }}
          LYNX_DEVTOOL_MCP_TESTING_OPEN_URL: ${{ env.SWIPER_BUNDLE_URL }}
        run: pnpm run test:e2e:public

      - name: E2E (devtool-mcp-server)
        working-directory: packages/mcp-servers/devtool-mcp-server
        env:
          LYNX_DEVTOOL_MCP_TESTING_PAGE_URL: ${{ env.SWIPER_BUNDLE_URL }}
          LYNX_DEVTOOL_MCP_TESTING_OPEN_URL: ${{ env.SWIPER_BUNDLE_URL }}
        run: node --test --test-concurrency=1 'e2e/**/*.test.ts'

      - name: Stop Lynxtron (Swiper bundle)
        if: always()
        run: |
          if [ -n "${LYNXTRON_SWIPER_PID:-}" ]; then
            kill "${LYNXTRON_SWIPER_PID}" 2>/dev/null || true
            timeout 10s tail --pid="${LYNXTRON_SWIPER_PID}" -f /dev/null || true
            kill -KILL -- "-${LYNXTRON_SWIPER_PID}" 2>/dev/null || true
          fi

      # --- ReactLynx: skill against the preact-devtools-enabled bundle ---

      - name: Start Lynxtron (ReactLynx bundle)
        run: |
          set -euo pipefail
          LYNXTRON_PAGE_URL="$REACT_DEVTOOL_BUNDLE_URL" \
            setsid node "$LYNXTRON_ROOT/node_modules/@lynx-js/lynxtron/cli.js" .github/scripts/lynxtron-e2e.mjs \
            < /dev/null > /tmp/lynxtron-reactlynx.log 2>&1 &
          pid=$!
          echo "LYNXTRON_REACT_PID=$pid" >> "$GITHUB_ENV"
          ./.github/scripts/wait-debug-router.sh /tmp/lynxtron-reactlynx.log "$pid"

      - name: E2E (agent-lynx reactlynx)
        working-directory: packages/agent-lynx
        env:
          LYNX_DEVTOOL_MCP_TESTING_PAGE_URL: ${{ env.REACT_DEVTOOL_BUNDLE_URL }}
          LYNX_DEVTOOL_MCP_TESTING_OPEN_URL: ${{ env.REACT_DEVTOOL_BUNDLE_URL }}
        run: pnpm run test:e2e:public

      - name: Stop Lynxtron (ReactLynx bundle)
        if: always()
        run: |
          if [ -n "${LYNXTRON_REACT_PID:-}" ]; then
            kill "${LYNXTRON_REACT_PID}" 2>/dev/null || true
            timeout 10s tail --pid="${LYNXTRON_REACT_PID}" -f /dev/null || true
            kill -KILL -- "-${LYNXTRON_REACT_PID}" 2>/dev/null || true
          fi

      - name: Upload Lynxtron logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lynxtron-logs
          path: /tmp/lynxtron-*.log
          if-no-files-found: ignore
