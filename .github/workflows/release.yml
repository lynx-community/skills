name: Release

on:
  push:
    branches:
      - codex/publish-connector-0.16.3-20261014

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Dependencies
        run: |
          npm i -g corepack
          npm --version
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Build public Connector
        run: pnpm --filter @lynx-js/devtool-connector run build

      - name: Publish public Connector
        run: pnpm --filter @lynx-js/devtool-connector publish --access public --no-git-checks
