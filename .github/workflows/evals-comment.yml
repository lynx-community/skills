name: Evals Comment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  evals-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Pnpm
        run: npm install -g corepack@latest && corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check skill eval definitions
        id: check-evals
        continue-on-error: true
        run: |
          mkdir -p artifacts
          pnpm eval:skill:check:all -- \
            --json-output artifacts/skill-evals-definition.json

      - name: Run online skill task evals
        id: task-evals
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.SKILL_EVAL_OPENCODE_API_KEY || secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SKILL_TASK_EVAL_IDS: ${{ vars.SKILL_EVAL_TASK_EVAL_IDS }}
          SKILL_TASK_GRADER_MODEL: ${{ vars.SKILL_EVAL_TASK_GRADER_MODEL || vars.SKILL_EVAL_TASK_MODEL || 'opencode/gpt-5-nano' }}
          SKILL_TASK_MAX_EVALS_PER_SKILL: ${{ vars.SKILL_EVAL_TASK_MAX_EVALS_PER_SKILL || '1' }}
          SKILL_TASK_MIN_PASS_RATE: ${{ vars.SKILL_EVAL_TASK_MIN_PASS_RATE || '0.85' }}
          SKILL_TASK_MODEL: ${{ vars.SKILL_EVAL_TASK_MODEL || 'opencode/gpt-5-nano' }}
          SKILL_TASK_TIMEOUT: ${{ vars.SKILL_EVAL_TASK_TIMEOUT || '300' }}
        run: |
          if [ -z "${OPENCODE_API_KEY:-}${OPENROUTER_API_KEY:-}${OPENAI_API_KEY:-}${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::Online skill task evals require a model credential secret. Configure SKILL_EVAL_OPENCODE_API_KEY, OPENCODE_API_KEY, OPENROUTER_API_KEY, OPENAI_API_KEY, or ANTHROPIC_API_KEY."
            exit 1
          fi

          if ! command -v opencode >/dev/null 2>&1; then
            npm --registry=https://registry.npmjs.org install -g opencode-ai@latest
          fi
          opencode --version

          EXTRA_ARGS=""
          if [ -n "$SKILL_TASK_EVAL_IDS" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --eval-ids $SKILL_TASK_EVAL_IDS"
          else
            EXTRA_ARGS="$EXTRA_ARGS --max-evals-per-skill $SKILL_TASK_MAX_EVALS_PER_SKILL"
          fi

          pnpm eval:skill:task:online:all -- \
            --model "$SKILL_TASK_MODEL" \
            --grader-model "$SKILL_TASK_GRADER_MODEL" \
            --timeout "$SKILL_TASK_TIMEOUT" \
            --min-pass-rate "$SKILL_TASK_MIN_PASS_RATE" \
            --output-root artifacts \
            $EXTRA_ARGS

      - name: Build eval comment report
        if: always()
        run: |
          pnpm eval:skill:comment-report -- \
            --definition-report artifacts/skill-evals-definition.json \
            --task-report-dir artifacts \
            --output artifacts/skill-evals-comment.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-evals-report
          path: artifacts/*.json
          if-no-files-found: error

      - name: Comment eval scores
        if: always()
        id: evals-comment
        uses: ./.github/actions/evals-comment
        with:
          result-file: artifacts/skill-evals-comment.json
          title: Skill Evals
          dry-run: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write eval scores to summary
        if: always()
        env:
          EVALS_COMMENT_BODY: ${{ steps.evals-comment.outputs.body }}
        run: printf '%s\n' "$EVALS_COMMENT_BODY" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on invalid eval definitions
        if: steps.check-evals.outcome != 'success'
        run: exit 1

      - name: Fail on online task eval failures
        if: steps.task-evals.outcome != 'success'
        run: exit 1
