name: Sync to Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: release-branch
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Setup tree command
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Export to dist
        run: |
          mkdir -p dist
          npx build-marketplace export ./dist
          cp README.md CONTRIBUTING.md dist/
          tree ./dist

      - name: Generate release sync token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_SYNC_APP_ID }}
          private-key: ${{ secrets.RELEASE_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push to release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          STAGE_DIR=$(mktemp -d)
          cp -R dist/. "$STAGE_DIR"

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin release || true
          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git checkout release
          else
            git checkout --orphan release
          fi
          git clean -fdx -e .git
          git checkout -- . 2>/dev/null || true

          ls -A "$STAGE_DIR" | while read -r item; do
            rm -rf "$item"
          done

          cp -R "$STAGE_DIR"/. . && rm -rf "$STAGE_DIR"

          APP_USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config --local user.name "${APP_SLUG}[bot]"
          git config --local user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit, skipping"
          else
            git commit -m "$(git log -1 --format='%B' "${{ github.sha }}")"
            git show HEAD
            git push origin release
          fi
