packages:
  - .
  - packages/*
  - packages/tools/*
  - packages/cmd/*
  - packages/skills/*
  - packages/plugins/*
  - packages/mcp-servers/*

catalogs:
  rstack:
    "@rslib/core": 1.0.3
    "@rsbuild/core": 2.2.13
    "@rspack/core": 2.2.9
    "@rstest/core": 0.12.3
  adb:
    "@yume-chan/adb": 3.0.0-beta.4
    "@yume-chan/adb-server-node-tcp": 3.0.0-beta.4
    "@yume-chan/stream-extra": 3.0.0-beta.4

allowBuilds:
  core-js: false
  dprint: false
  esbuild: false

packageExtensions:
  eslint-plugin-headers@1:
    # Rslint runs this plugin without loading the ESLint engine.
    peerDependenciesMeta:
      eslint:
        optional: true
