packages:
  - .
  - packages/*
  - packages/tools/*
  - packages/cmd/*
  - packages/skills/*
  - packages/plugins/*
  - packages/mcp-servers/*

catalogPrune: true

catalogs:
  mcp_sdk:
    "@modelcontextprotocol/sdk": ^1.32.2
  rstack:
    "@rslib/core": ^1.0.6
    "@rstest/core": 0.12.6
  adb:
    "@yume-chan/adb": 3.0.0-beta.5
    "@yume-chan/adb-server-node-tcp": 3.0.0-beta.5
    "@yume-chan/stream-extra": 3.0.0-beta.5

allowBuilds:
  core-js: false
  dprint: false
  esbuild: false

packageExtensions:
  eslint-plugin-headers@1:
    # Rslint runs this plugin without loading the ESLint engine.
    peerDependenciesMeta:
      eslint:
        optional: true

minimumReleaseAgeExcludePrune: true

minimumReleaseAgeExclude:
  - "@lynx-js/*"
  - "@rsbuild/*"
  - "@rspack/*"
  - "@rslib/*"
  - rsbuild-plugin-dts
